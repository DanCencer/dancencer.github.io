bio: |
  Dan Cencer is an Associate Sport Scientist for Ohio State Football,
  where he leads athlete monitoring, technology integration, and data analysis.
  His work turns GPS, force plate, sprint, and strength data into individualized,
  decision-ready information for coaches and performance staff. He also leads
  the program's sport science internship and is pursuing a PhD examining
  cultural leadership in collegiate athletics.

